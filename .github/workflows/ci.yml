name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
permissions:
  contents: write
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/task_service/requirements.txt
          pip install -r services/notification_service/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build task-service image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/devops-gitops-platform/task-service:${{ github.sha }} ./services/task_service

      - name: Build notification-service image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/devops-gitops-platform/notification-service:${{ github.sha }} ./services/notification_service
      
      - name: Push task-service image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-gitops-platform/task-service:${{ github.sha }}

      - name: Push notification-service image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-gitops-platform/notification-service:${{ github.sha }}
      - name: Update Helm image tags
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/g" helm/devops-gitops-platform/values.yaml

      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/devops-gitops-platform/values.yaml
          git commit -m "chore:update image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push