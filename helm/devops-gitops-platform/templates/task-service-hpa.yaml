{{- if .Values.taskService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-service-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-service

  minReplicas: {{ .Values.taskService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.taskService.autoscaling.maxReplicas }}

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.taskService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}